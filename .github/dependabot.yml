version: 2
updates:
  # keep the Go and Rust halves in step; both are checked by the interop job
  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
