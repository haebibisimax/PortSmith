name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  go:
    name: Go (portcap)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...

  rust:
    name: Rust (portsmith-replay)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  interop:
    name: Cross-language interop
    runs-on: ubuntu-latest
    needs: [ go, rust ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Normalize with Go, infer with Rust
        run: |
          cd go && go run ./cmd/portcap normalize -in ../samples/redis.log \
            -proto redis -session a1b2c3 -start 1700000000000000000 -step 50000000 \
            -out ../samples/roundtrip.trace
          cd ../rust && cargo run --quiet -- infer -in ../samples/roundtrip.trace
